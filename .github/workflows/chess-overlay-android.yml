name: Chess Overlay AI — APK Android

# Construit l'APK de Chess Overlay AI sur les serveurs gratuits de GitHub :
# compile Stockfish 17.1 depuis les sources officielles avec le NDK Android (ARM64),
# lance les tests (règles, moteur, analyse, vision) puis publie l'APK signé.
# Déclenchement manuel possible depuis l'application GitHub ou le site sur téléphone :
# onglet « Actions » → « Chess Overlay AI — APK Android » → « Run workflow ».

on:
  push:
    paths:
      - "chess-overlay-ai/**"
      - ".github/workflows/chess-overlay-android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chess-overlay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: chess-overlay-ai
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache de Stockfish compilé
        id: sfcache
        uses: actions/cache@v4
        with:
          path: |
            chess-overlay-ai/app/src/main/jniLibs
            chess-overlay-ai/build/stockfish-host
          key: stockfish-sf_17.1-${{ hashFiles('chess-overlay-ai/scripts/build_stockfish.sh') }}

      - name: Compilation de Stockfish (Android ARM64 + hôte pour les tests)
        if: steps.sfcache.outputs.cache-hit != 'true'
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          scripts/build_stockfish.sh android
          SF_WORK_DIR="$PWD/build/stockfish-host-src" scripts/build_stockfish.sh host

      - name: Tests unitaires et d'intégration
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew test --console=plain

      - name: Construction de l'APK
        run: ./gradlew :app:assembleRelease --console=plain

      - name: Renommage
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/ChessOverlayAI-${{ github.run_number }}.apk"

      - name: Artefact
        uses: actions/upload-artifact@v4
        with:
          name: ChessOverlayAI-apk
          path: chess-overlay-ai/out/*.apk

      - name: Publication (page « Releases », téléchargeable depuis le téléphone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: chess-overlay-build-${{ github.run_number }}
          name: Chess Overlay AI — build ${{ github.run_number }}
          prerelease: true
          files: chess-overlay-ai/out/*.apk
          body: |
            APK Android (ARM64) de Chess Overlay AI, construit automatiquement depuis la branche `${{ github.ref_name }}`.
            Stockfish 17.1 compilé depuis les sources officielles (GPL v3) : https://github.com/official-stockfish/Stockfish/tree/sf_17.1
            Installation : téléchargez le fichier .apk sur le téléphone, ouvrez-le et autorisez l'installation depuis cette source.
